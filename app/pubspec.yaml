name: code2ticket
description: "Aplikasi giveaway: ubah kode menjadi tiket undian yang dapat diverifikasi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.1.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  image: ^4.12.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  path: ^1.9.1
  pointycastle: ^4.0.0
  provider: ^6.1.5+1
  sensors_plus: ^7.1.1
  sqflite: ^2.4.4+2
  timezone: ^0.11.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+1

flutter:
  uses-material-design: true
